<!doctype html>
<html lang="en" data-theme="chatgpt">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ScanAI — Premium AI Visual Assistant</title>
		<meta name="description" content="Visual scanning assistant powered by ChatGPT, Claude, and Gemini. See it. Scan it. Understand it." />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/logo.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#09090b" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="ScanAI" />
		<meta property="og:image" content="/logo.png" />
		<meta name="twitter:image" content="/logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
		<script>
			// Anti-flicker synchronous theme initialization
			try {
				const p = localStorage.getItem('scanai_provider');
				if (p && ['chatgpt', 'claude', 'gemini'].includes(p)) {
					document.documentElement.dataset.theme = p;
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-[var(--bg-app)] text-[var(--text-primary)] antialiased selection:bg-[var(--accent-glow)] selection:text-[var(--text-primary)]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
